
name: SecureCorp AWS Security CI

on:
  push:
    branches:
      - main
      - feature/security-ci

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securecorp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate AWS Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AWS CDK
        run: |
          npm install --global aws-cdk
          cdk --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q app.py secure_corp_aws tests

      - name: Synthesize CloudFormation
        run: |
          cdk synth --output cdk.out --quiet

      - name: Inspect generated templates
        run: |
          echo "Generated CloudFormation templates:"
          find cdk.out -maxdepth 1 \
            -type f -name "*.template.json" -print

      - name: Verify CloudFormation template
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          templates = list(
              Path("cdk.out").glob("*.template.json")
          )

          assert len(templates) == 1, (
              f"Expected one template, found: {templates}"
          )

          with templates[0].open(
              encoding="utf-8-sig"
          ) as file:
              data = json.load(file)

          assert isinstance(data.get("Resources"), dict)

          print(f"Validated: {templates[0]}")
          PY

      - name: Run automated security tests
        run: |
          python -m pytest -q

      - name: Run SecureCorp security audit
        run: |
          python audit_security.py

      - name: Bandit security scan
        run: |
          python -m pip install "bandit>=1.7,<2"
          bandit -r app.py secure_corp_aws -f txt
        continue-on-error: true

      - name: Ruff lint
        run: |
          python -m pip install "ruff>=0.9,<1"
          ruff check app.py secure_corp_aws tests
        continue-on-error: true

      - name: Upload CloudFormation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securecorp-cloudformation
          path: cdk.out/*.template.json
          if-no-files-found: error
          retention-days: 7

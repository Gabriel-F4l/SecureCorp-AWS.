
name: SecureCorp AWS Security CI

on:
  push:
    branches:
      - main
      - feature/security-ci

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securecorp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate AWS Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout do repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 3. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 4. Instalar AWS CDK CLI
      - name: Install AWS CDK
        run: |
          npm install --global aws-cdk
          cdk --version

      # 5. Instalar dependencias Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # 6. Verificar sintaxe Python
      - name: Validate Python syntax
        run: |
          python -m compileall -q app.py secure_corp_aws tests

      # 7. Gerar template CloudFormation
      # Deve executar antes dos testes
      - name: Synthesize CloudFormation
        run: |
          cdk synth --output cdk.out --quiet

      # 8. Validar arquivo gerado
      - name: Verify CloudFormation template
        run: |
          echo "Checking CloudFormation template"

          ls -lah cdk.out/

          test -f \
            cdk.out/SecureCorpAWSStack.template.json

          python -m json.tool \
            cdk.out/SecureCorpAWSStack.template.json \
            > /dev/null

          echo "CloudFormation template is valid JSON"

      # 9. Executar testes automatizados
      - name: Run automated security tests
        run: |
          python -m pytest -q

      # 10. Executar auditoria personalizada
      - name: Run SecureCorp security audit
        run: |
          python audit_security.py

      # 11. Analise estatica de seguranca
      - name: Bandit security scan
        run: |
          python -m pip install "bandit>=1.7,<2"
          bandit -r app.py secure_corp_aws -f txt
        continue-on-error: true

      # 12. Analise de qualidade Python
      - name: Ruff lint
        run: |
          python -m pip install "ruff>=0.9,<1"
          ruff check app.py secure_corp_aws tests
        continue-on-error: true

      # 13. Publicar template CloudFormation
      - name: Upload CloudFormation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securecorp-cloudformation
          path: cdk.out/SecureCorpAWSStack.template.json
          if-no-files-found: error
          retention-days: 7

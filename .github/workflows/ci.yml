name: Security CI

on:
  push:
    branches: [main, feature/security-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python tests and CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          npm install --global aws-cdk
      - name: Compile Python files
        run: python -m compileall -q app.py secure_corp_aws tests
      - name: Run tests
        run: python -m pytest -q
      - name: Synthesize CloudFormation
        run: cdk synth --quiet
      - name: Bandit security scan (report only)
        run: |
          pip install 'bandit>=1.7,<2'
          bandit -r app.py secure_corp_aws -f txt
        continue-on-error: true
      - name: Ruff lint (report only)
        run: |
          pip install 'ruff>=0.9,<1'
          ruff check app.py secure_corp_aws tests
        continue-on-error: true

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">SecureCorp AWS infrastructure as code architecture</title><desc id="desc">CDK and Terraform configurations, validation workflows, multi-AZ VPC, S3 gateway endpoint, and flow logs. No resources deployed.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6eef9}.title{font-size:35px;font-weight:700}.sub{font-size:17px;fill:#a6bad4}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#b7c9df}.box{fill:#17283e;stroke:#3b587a;stroke-width:2}.az{fill:#13283a;stroke:#4d8cd6;stroke-width:2;stroke-dasharray:8 6}.line{stroke:#70b5ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke:#a6bad4;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#70b5ff"/></marker></defs><rect width="1280" height="760" rx="22" fill="#0b1627"/><text x="48" y="65" class="title">SecureCorp AWS</text><text x="48" y="98" class="sub">Secure Cloud Architecture  •  Infrastructure as Code  •  Security by Design</text><rect x="930" y="38" width="302" height="42" rx="21" fill="#4d341b" stroke="#edab5d"/><text x="1081" y="65" font-size="17" text-anchor="middle" fill="#ffd29b">IaC LAB — NOT DEPLOYED</text><rect class="box" x="48" y="142" width="345" height="132" rx="14"/><text x="73" y="180" class="label">GitHub Actions • CI</text><text x="73" y="209" class="small">Python tests · CDK synthesis</text><text x="73" y="234" class="small">Terraform validate · Checkov</text><rect class="box" x="443" y="142" width="345" height="132" rx="14"/><text x="468" y="180" class="label">AWS CDK + Python</text><text x="468" y="209" class="small">S3 bucket · IAM permissions</text><text x="468" y="234" class="small">CloudFormation synthesis</text><rect class="box" x="838" y="142" width="394" height="132" rx="14"/><text x="863" y="180" class="label">Terraform</text><text x="863" y="209" class="small">VPC · subnet routes · endpoint · SG</text><text x="863" y="234" class="small">Flow Logs · CloudWatch · KMS</text><path class="line" d="M393 206 H443"/><path class="line" d="M788 206 H838"/><rect x="48" y="312" width="1184" height="366" rx="18" fill="#0f2133" stroke="#3d759f" stroke-width="2"/><text x="78" y="352" class="label">VPC 10.20.0.0/16 • 2 Availability Zones (Terraform design)</text><rect class="az" x="77" y="381" width="505" height="171" rx="14"/><rect class="az" x="699" y="381" width="505" height="171" rx="14"/><text x="102" y="415" class="label">Availability Zone A</text><text x="724" y="415" class="label">Availability Zone B</text><rect class="box" x="100" y="435" width="215" height="84" rx="12"/><text x="119" y="464" class="label">Public subnet</text><text x="119" y="489" class="small">10.20.1.0/24</text><rect class="box" x="337" y="435" width="217" height="84" rx="12"/><text x="354" y="464" class="label">Isolated subnet</text><text x="354" y="489" class="small">10.20.11.0/24</text><rect class="box" x="722" y="435" width="215" height="84" rx="12"/><text x="741" y="464" class="label">Public subnet</text><text x="741" y="489" class="small">10.20.2.0/24</text><rect class="box" x="959" y="435" width="217" height="84" rx="12"/><text x="976" y="464" class="label">Isolated subnet</text><text x="976" y="489" class="small">10.20.12.0/24</text><path class="line" d="M446 519 V591 H580"/><path class="line" d="M1067 519 V591 H833"/><rect class="box" x="580" y="561" width="253" height="69" rx="12"/><text x="706" y="590" text-anchor="middle" class="label">S3 Gateway Endpoint</text><text x="706" y="612" text-anchor="middle" class="small">Private route to S3</text><rect class="box" x="48" y="700" width="360" height="42" rx="10"/><text x="228" y="727" text-anchor="middle" class="small">CDK: Private S3 + IAM policies</text><rect class="box" x="450" y="700" width="375" height="42" rx="10"/><text x="638" y="727" text-anchor="middle" class="small">Terraform: VPC Flow Logs → CloudWatch</text><rect class="box" x="867" y="700" width="365" height="42" rx="10"/><text x="1049" y="727" text-anchor="middle" class="small">KMS key rotation for log encryption</text><text x="79" y="656" class="small">No NAT Gateway • No EC2 provisioned • Static validation only</text></svg>